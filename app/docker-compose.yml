services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15

  migrate:
    build: .
    command: ["python", "-m", "src.migrate"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      APP_VERSION: local
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
