# The shared "landscape": a simulated trading platform for projects 12–17.
#   docker compose up -d --build
#   Prometheus  http://localhost:9090
#   Alertmanager http://localhost:9093
#   Simulator    http://localhost:9200/state  (inject faults with POST /fault)
services:
  simulator:
    build: ./simulator
    environment: { CATALOG: /catalog.yaml }
    volumes: ["./catalog.yaml:/catalog.yaml:ro"]
    ports: ["9200:9200"]

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["9093:9093"]
    extra_hosts: ["host.docker.internal:host-gateway"]
