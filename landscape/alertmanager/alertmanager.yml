route:
  receiver: triage
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  # Project 14 runs the triage service on :8080. Until then, delivery fails harmlessly
  # and you can still see alerts at http://localhost:9093.
  - name: triage
    webhook_configs:
      - url: http://host.docker.internal:8080/alerts
        send_resolved: true
