# Vault (dev mode) issuing short-lived Postgres credentials to the app via Vault Agent.
# Dev mode = in-memory, auto-unsealed, root token "root". NEVER use dev mode outside a lab.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 2s, retries: 15 }

  migrate:
    build: { context: "${APP_DIR:-./app}" }
    command: ["python", "-m", "src.migrate"]
    environment: { DATABASE_URL: "postgresql://app:app@db:5432/app" }
    depends_on: { db: { condition: service_healthy } }

  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]

  # One-shot: configure the database secrets engine (scripts/vault-setup.sh).
  vault-setup:
    image: hashicorp/vault:1.18
    environment: { VAULT_ADDR: "http://vault:8200", VAULT_TOKEN: root }
    volumes:
      - ./scripts/vault-setup.sh:/vault-setup.sh:ro
      - agent-token:/token
      - secrets:/secrets
    entrypoint: ["/bin/sh", "/vault-setup.sh"]
    depends_on:
      vault: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  # Renders /secrets/database_url and re-renders it before the lease expires.
  vault-agent:
    image: hashicorp/vault:1.18
    command: ["vault", "agent", "-config=/etc/vault-agent/agent.hcl"]
    volumes:
      - ./vault:/etc/vault-agent:ro
      - agent-token:/token:ro
      - secrets:/secrets
    depends_on: { vault-setup: { condition: service_completed_successfully } }

  app:
    build: { context: "${APP_DIR:-./app}" }
    environment:
      DATABASE_URL_FILE: /secrets/database_url # re-read on every connection, see app/README.md
      APP_VERSION: secrets-lab
    volumes: ["secrets:/secrets:ro"]
    ports: ["8000:8000"]
    depends_on: [vault-agent]

volumes:
  agent-token:
  secrets:
