# Requires External Secrets Operator: https://external-secrets.io
# Syncs the RDS-managed master secret (project 01, manage_master_user_password) into a k8s Secret.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt: # IRSA / pod identity: no static AWS keys in the cluster
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db
  namespace: zdd
spec:
  # DECISION (ADR-0004): how quickly a rotated secret reaches pods.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-db
    template:
      data:
        database_url: "postgresql://{{ .username }}:{{ .password }}@REPLACE_DB_ENDPOINT:5432/app?sslmode=require"
  dataFrom:
    - extract:
        key: REPLACE_WITH_db_secret_arn_OUTPUT_FROM_PROJECT_01
