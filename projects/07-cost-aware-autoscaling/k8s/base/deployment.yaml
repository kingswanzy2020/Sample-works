apiVersion: v1
kind: Namespace
metadata:
  name: scale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: scale
  labels: { app: sample, team: payments, cost-center: cc-123 } # labels drive cost allocation (ADR-0004)
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample }
  template:
    metadata:
      labels: { app: sample, team: payments, cost-center: cc-123 }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: sample-service:v1
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: DATABASE_URL, value: "postgresql://app:app@postgres:5432/app" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2 }
          # DECISION (ADR-0002): these numbers are guesses. Right-size them from data (VPA recommendations).
          # requests = what the scheduler reserves (and what you pay for on the node).
          # CPU limit deliberately omitted: throttling hurts latency; memory limit kept to contain leaks.
          resources:
            requests: { cpu: 250m, memory: 192Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: scale
spec:
  type: NodePort
  selector: { app: sample }
  ports: [{ port: 80, targetPort: http, nodePort: 30080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
  namespace: scale
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: sample }
