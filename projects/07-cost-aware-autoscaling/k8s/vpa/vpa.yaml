# Recommendation-only VPA: tells you what requests SHOULD be, without restarting pods.
# Requires the VPA components: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
#   kubectl -n scale describe vpa app   → look at "Target" and "Upper Bound"
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: app
  namespace: scale
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: app }
  updatePolicy:
    updateMode: "Off" # don't fight the HPA; use VPA as a sizing advisor
