# DECISION (ADR-0005): a static inventory is the starting point. Where should the
# source of truth for "which servers exist" live as the fleet grows?
[trading]
trading-01 ansible_port=2221
trading-02 ansible_port=2222

[kafka]
kafka-01 ansible_port=2223
kafka-02 ansible_port=2224

[monitoring]
monitoring-01 ansible_port=2225
monitoring-02 ansible_port=2226

[all:vars]
ansible_host=127.0.0.1
ansible_python_interpreter=/usr/bin/python3
