name: drift-detection

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # keep real exit codes
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - id: check
        run: |
          set +e
          ./scripts/drift-check.sh envs/${{ matrix.env }} | tee drift.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # DECISION (ADR-0004): detect and open an issue; a human decides whether to revert or codify.
      - if: steps.check.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('drift.txt', 'utf8');
            await github.rest.issues.create({
              ...context.repo,
              title: `Drift detected in ${{ matrix.env }}`,
              body: "```\n" + body + "\n```",
              labels: ['drift'],
            });
      - if: steps.check.outputs.code == '1'
        run: exit 1
