name: terraform-plan

on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/terraform-plan.yml"]

permissions:
  contents: read
  id-token: write       # OIDC to AWS, no long-lived keys
  pull-requests: write  # comment the plan

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: validate modules and envs
        run: |
          for d in modules/* envs/*; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  plan:
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # DECISION (ADR-0003): a read-only "plan" role for PRs, separate from the "apply" role.
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform -chdir=envs/${{ matrix.env }} init -input=false
      - id: plan
        run: terraform -chdir=envs/${{ matrix.env }} plan -input=false -no-color -lock=false | tee plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Plan: \`${{ matrix.env }}\`\n<details><summary>show</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`,
            });
