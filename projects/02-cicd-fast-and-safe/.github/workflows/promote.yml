name: promote

# DECISION (ADR-0005): environments get an *existing* digest, never a rebuild.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest that passed CI (sha256:...)"
        required: true
      environment:
        description: "Target environment"
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # add required reviewers on 'prod' in repo settings
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sample-service
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: refuse unsigned images
        run: |
          cosign verify "${IMAGE}@${{ inputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: retag digest
        run: docker buildx imagetools create -t "${IMAGE}:${{ inputs.environment }}" "${IMAGE}@${{ inputs.digest }}"
