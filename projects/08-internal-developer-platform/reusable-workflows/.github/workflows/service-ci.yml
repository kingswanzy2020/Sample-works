# The platform's golden pipeline (project 02, generalized). Lives in the org "platform" repo
# and is versioned by tag (@v1). Services call it with `uses:`.
name: service-ci

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: true
      python-version:
        type: string
        default: "3.12"
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q || [ $? -eq 5 ] # exit 5 = no tests collected; new services start with none

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Mandatory guardrails: services can't opt out (platform ADR-0003).
      - uses: aquasecurity/trivy-action@0.28.0
        if: github.event_name == 'push'
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - if: github.event_name == 'push'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
