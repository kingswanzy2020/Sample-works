apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-latest
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "Use an immutable digest or version tag, not :latest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
