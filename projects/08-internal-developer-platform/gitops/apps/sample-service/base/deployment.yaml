apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  labels: { app: sample-service, team: payments }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample-service }
  template:
    metadata:
      labels: { app: sample-service, team: payments }
    spec:
      containers:
        - name: app
          image: ghcr.io/REPLACE_ORG/sample-service
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
