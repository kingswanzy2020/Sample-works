# Two full copies. The Service selector decides which one is live.
# Cost: 2x capacity while both run. Benefit: instant switch and instant rollback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: zdd
spec:
  replicas: 4
  selector:
    matchLabels: { app: sample, track: blue }
  template:
    metadata:
      labels: { app: sample, track: blue }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: app
          image: sample-service:v1
          ports: [{ name: http, containerPort: 8000 }]
          env: [{ name: DATABASE_URL, value: "postgresql://app:app@postgres:5432/app" }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: zdd
spec:
  replicas: 0 # scaled up by scripts/blue-green-switch.sh
  selector:
    matchLabels: { app: sample, track: green }
  template:
    metadata:
      labels: { app: sample, track: green }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: app
          image: sample-service:v2
          ports: [{ name: http, containerPort: 8000 }]
          env: [{ name: DATABASE_URL, value: "postgresql://app:app@postgres:5432/app" }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: zdd
spec:
  type: NodePort
  selector: { app: sample, track: blue } # the switch
  ports: [{ port: 80, targetPort: http, nodePort: 30080 }]
