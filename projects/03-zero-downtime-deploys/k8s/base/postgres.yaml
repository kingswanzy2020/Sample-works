# Lab-only Postgres: a single pod with emptyDir storage. Data is lost when the pod restarts.
# That's acceptable here because this project is about the app tier; project 06 covers data durability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: zdd
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_PASSWORD, value: app }
            - { name: POSTGRES_DB, value: app }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "app"] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: zdd
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
